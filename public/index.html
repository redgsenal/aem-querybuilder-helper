<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEM Query Builder</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
<div class="container">

  <header>
    <h1>AEM Query Builder</h1>
    <p>Runs against <strong>http://localhost:4502/bin/querybuilder.json</strong> as <code>admin</code></p>
  </header>

  <div class="card">
    <h2>Query Parameters <a href="/help.html" target="_blank" rel="noopener" style="font-size:.8rem;font-weight:400;color:#0052cc;margin-left:.75rem;text-decoration:none;vertical-align:middle">? Help</a></h2>
    <form id="queryForm" autocomplete="off">
      <div class="fields">

        <div class="field full">
          <label for="f-domain">Domain</label>
          <select id="f-domain" name="_domain">
            <option value="local">Local — http://localhost:4502</option>
            <option value="sit1">SIT1 — https://author-p93552-e850488.adobeaemcloud.com</option>
          </select>
        </div>

        <div class="field">
          <label for="f-path">Path <code>path</code></label>
          <input type="text" id="f-path" name="path" placeholder="/content" value="/content/bpi/ph/en/bpi-test" list="path-history" autocomplete="off" />
          <datalist id="path-history"></datalist>
        </div>

        <div class="field">
          <label for="f-type">Node Type <code>type</code></label>
          <input type="text" id="f-type" name="type" placeholder="cq:Page" value="nt:unstructured" list="node-type-options" autocomplete="off" />
          <datalist id="node-type-options">
            <option value="cq:Page"></option>
            <option value="cq:PageContent"></option>
            <option value="dam:Asset"></option>
            <option value="nt:unstructured"></option>
            <option value="cq:Component"></option>
            <option value="cq:Template"></option>
            <option value="rep:User"></option>
          </datalist>
        </div>

        <div class="field">
          <label for="f-property">Property <code>property</code></label>
          <input type="text" id="f-property" name="property" placeholder="jcr:content/cq:template" value="sling:resourceType" list="property-options" autocomplete="off" />
          <datalist id="property-options">
            <option value="jcr:content/cq:template"></option>
            <option value="jcr:content/sling:resourceType"></option>
            <option value="sling:resourceType"></option>
            <option value="jcr:content/jcr:title"></option>
            <option value="jcr:content/cq:tags"></option>
            <option value="jcr:content/jcr:lastModifiedBy"></option>
            <option value="jcr:content/cq:lastReplicationAction"></option>
            <option value="jcr:primaryType"></option>
          </datalist>
        </div>

        <div class="field">
          <label for="f-property-value">Property Value <code>property.value</code></label>
          <input type="text" id="f-property-value" name="property.value" placeholder="/conf/mysite/.../template" value="bpi/components/" list="property-value-history" autocomplete="off" />
          <datalist id="property-value-history"></datalist>
        </div>

        <div class="field">
          <label for="f-limit">Limit <code>p.limit</code></label>
          <input type="number" id="f-limit" name="p.limit" placeholder="100" min="-1" value="100" />
        </div>

      </div>

      <div class="actions">
        <button type="submit" id="submitBtn">Run Query</button>
        <button type="button" id="clearBtn">Clear</button>
        <div class="spinner" id="spinner"></div>
      </div>
    </form>

    <p class="query-preview" id="preview" style="margin-top:1rem"></p>
  </div>

  <div class="card" id="resultsCard" style="display:none">
    <div id="status"></div>

    <div class="tabs" style="margin-top:1rem">
      <button class="tab active" data-tab="table">Hits</button>
      <button class="tab" data-tab="raw">Raw JSON</button>
    </div>

    <div class="tab-panel active" id="tab-table"></div>
    <div class="tab-panel" id="tab-raw"><pre id="rawJson"></pre></div>

    <div id="pagination" style="display:none">
      <button id="prevBtn">&#8592; Prev</button>
      <span id="pageInfo"></span>
      <button id="nextBtn">Next &#8594;</button>
    </div>
  </div>

</div>

<script src="/assets/query-builder.js"></script>
</body>
</html>
